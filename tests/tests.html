<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Tests — Miel d'Enghien</title>
  <style>
    body { font-family: system-ui, sans-serif; padding: 16px; }
    .ok { color: #15803d; } .ko { color: #b91c1c; font-weight: 700; }
    #bilan { font-size: 1.3rem; font-weight: 700; }
  </style>
</head>
<body>
  <h1>Tests des modules de calcul</h1>
  <p id="bilan">…</p>
  <ul id="resultats"></ul>
  <script type="module">
    // Ouvrir cette page via le serveur local (pas en file://) : http://localhost:8765/tests/tests.html
    import { toCents, formatEuro, centsToEpc, centsToInput } from '../js/money.js';
    import { buildEpcPayload, ibanValide, nettoyer, formaterIban } from '../js/epc.js';
    import { calculerPanier, parseRemise, mouvementsDeVente } from '../js/panier.js';
    import { calculerStocks, niveauStock, ecartInventaire } from '../js/stock.js';
    import { normaliser, emailValide, rechercher, trouverDoublons, statsClients, distance } from '../js/clients.js';
    import { construireTicket } from '../js/ticket.js';
    import { mouvementsAnnulation } from '../js/panier.js';
    import { encaissements, livraisonsAFacturer, regrouper, versCsv, versTexte, clePeriode } from '../js/journal.js';

    const resultats = [];
    function test(nom, f) {
      try { f(); resultats.push({ nom, ok: true }); }
      catch (e) { resultats.push({ nom, ok: false, detail: e.message }); }
    }
    function egal(obtenu, attendu) {
      const a = JSON.stringify(obtenu), b = JSON.stringify(attendu);
      if (a !== b) throw new Error(`obtenu ${a}, attendu ${b}`);
    }
    function leve(f) {
      try { f(); } catch { return; }
      throw new Error('une erreur était attendue');
    }

    // IBAN d'exemple public (documentation ISO), pas un vrai compte.
    const IBAN = 'BE68 5390 0754 7034';

    test('toCents : formats courants', () => {
      egal(toCents('12,50'), 1250); egal(toCents('12.5'), 1250); egal(toCents('10'), 1000);
      egal(toCents('-0,50'), -50); egal(toCents('10 €'), 1000); egal(toCents('0,07'), 7);
    });
    test('toCents : saisies invalides', () => {
      egal(toCents('abc'), null); egal(toCents(''), null); egal(toCents('1,234'), null);
    });
    test('formatEuro et centsToInput', () => {
      egal(formatEuro(1250), '12,50 €'); egal(formatEuro(-50), '-0,50 €'); egal(centsToInput(5), '0,05');
    });
    test('centsToEpc : point décimal', () => { egal(centsToEpc(1250), '12.50'); egal(centsToEpc(5), '0.05'); });

    test('IBAN : validation modulo 97', () => {
      egal(ibanValide(IBAN), true);
      egal(ibanValide('BE68 5390 0754 7035'), false);
      egal(ibanValide(''), false);
      egal(formaterIban('be68539007547034'), 'BE68 5390 0754 7034');
    });
    test('nettoyer : accents et caractères spéciaux', () => {
      egal(nettoyer('Été à Marcq & Cie', 70), 'Ete a Marcq Cie');
      egal(nettoyer('abcdef', 3), 'abc');
    });

    test('EPC : structure exacte du payload', () => {
      const p = buildEpcPayload({ bic: 'gkccbebb', nom: 'Camille Dupont', iban: IBAN, montantCents: 2000, communication: 'MIEL ENGHIEN J26-0042' });
      egal(p.split('\n'), ['BCD', '002', '1', 'SCT', 'GKCCBEBB', 'Camille Dupont', 'BE68539007547034', 'EUR20.00', '', '', 'MIEL ENGHIEN J26-0042']);
    });
    test('EPC : non-régression — ligne 10 (structurée) vide, libellé en ligne 11', () => {
      const lignes = buildEpcPayload({ nom: 'X', iban: IBAN, montantCents: 100, communication: 'TEST' }).split('\n');
      egal(lignes[9], ''); egal(lignes[10], 'TEST'); egal(lignes.length, 11);
    });
    test('EPC : sans communication, lignes vides finales omises', () => {
      const lignes = buildEpcPayload({ nom: 'X', iban: IBAN, montantCents: 100 }).split('\n');
      egal(lignes.length, 8); egal(lignes[7], 'EUR1.00');
    });
    test('EPC : bénéficiaire sans accents', () => {
      egal(buildEpcPayload({ nom: 'Hélène Lefèvre', iban: IBAN, montantCents: 100 }).split('\n')[5], 'Helene Lefevre');
    });
    test('EPC : refuse IBAN invalide, montant nul ou négatif, nom vide', () => {
      leve(() => buildEpcPayload({ nom: 'X', iban: 'BE00', montantCents: 100 }));
      leve(() => buildEpcPayload({ nom: 'X', iban: IBAN, montantCents: 0 }));
      leve(() => buildEpcPayload({ nom: 'X', iban: IBAN, montantCents: -50 }));
      leve(() => buildEpcPayload({ nom: '', iban: IBAN, montantCents: 100 }));
    });

    const produits = [
      { id: 'a', nom_fr: 'Miel', lot: 'M02', prix_cents: 1000 },
      { id: 'b', nom_fr: 'Hydromel', lot: '', prix_cents: 1500 },
    ];
    test('remise : pourcentage, montant, bornes', () => {
      egal(parseRemise('10%', 2500).cents, 250);
      egal(parseRemise('2,50', 2500).cents, 250);
      egal(parseRemise('50', 2500).cents, 2500);
      egal(parseRemise('', 2500).cents, 0);
      egal(parseRemise('abc', 2500).cents, 0);
    });
    test('panier : total simple', () => {
      const c = calculerPanier({ produits, quantites: { a: 2, b: 1 } });
      egal(c.totalCents, 3500); egal(c.lignes.length, 2); egal(c.nbArticles, 3);
    });
    test('panier : consignes déduites, hors assiette de remise', () => {
      const c = calculerPanier({ produits, quantites: { a: 2 }, consignes: 3, consigneCents: 50, remise: '10%' });
      egal(c.sousTotalCents, 1850); egal(c.remiseCents, 200); egal(c.totalCents, 1650);
    });
    test('panier : retour de consignes seul = total négatif', () => {
      egal(calculerPanier({ produits, quantites: {}, consignes: 4, consigneCents: 50 }).totalCents, -200);
    });
    test('panier : ligne à montant libre', () => {
      const c = calculerPanier({ produits, quantites: {}, divers: [{ libelle: 'Bougie', cents: 400 }] });
      egal(c.totalCents, 400); egal(c.lignes[0].produit_id, 'DIVERS');
    });
    test('mouvements de stock d\'une vente', () => {
      const c = calculerPanier({ produits, quantites: { a: 2 }, consignes: 1, divers: [{ libelle: 'x', cents: 100 }] });
      egal(mouvementsDeVente(c.lignes), [
        { produit_id: 'a', delta: -2, motif: 'vente' },
        { produit_id: 'POTS_VIDES', delta: 1, motif: 'retour_consigne' },
      ]);
    });

    test('stock : somme des mouvements', () => {
      const s = calculerStocks([
        { produit_id: 'a', delta: 40, motif: 'recolte' },
        { produit_id: 'a', delta: -2, motif: 'vente' },
        { produit_id: 'a', delta: -1, motif: 'casse' },
        { produit_id: 'b', delta: -3, motif: 'vente' },
        { produit_id: 'POTS_VIDES', delta: 1, motif: 'retour_consigne' },
      ]);
      egal(s.a, { quantite: 37, initialise: true });
      egal(s.b, { quantite: -3, initialise: false });
      egal(s.POTS_VIDES, { quantite: 1, initialise: true });
    });
    test('stock : une vente annulée rétablit le stock', () => {
      const s = calculerStocks([
        { produit_id: 'a', delta: 10, motif: 'recolte' },
        { produit_id: 'a', delta: -2, motif: 'vente' },
        { produit_id: 'a', delta: 2, motif: 'annulation_vente' },
      ]);
      egal(s.a.quantite, 10);
    });
    test('stock : niveaux alerte', () => {
      egal(niveauStock(undefined, 5), 'inconnu');
      egal(niveauStock({ quantite: -3, initialise: false }, 5), 'inconnu');
      egal(niveauStock({ quantite: 0, initialise: true }, 5), 'rupture');
      egal(niveauStock({ quantite: 4, initialise: true }, 5), 'bas');
      egal(niveauStock({ quantite: 5, initialise: true }, 5), 'bas');
      egal(niveauStock({ quantite: 6, initialise: true }, 5), 'ok');
      egal(niveauStock({ quantite: 6, initialise: true }, null), 'ok');
      egal(niveauStock({ quantite: 2, initialise: true }, null, 3), 'rupture');
    });
    test('stock : inventaire — théorique 12, compté 10 donne un écart de −2', () => {
      egal(ecartInventaire(10, 12), -2); egal(ecartInventaire(5, -3), 8); egal(ecartInventaire(7, 7), 0);
    });

    const clients = [
      { id: '1', nom: 'Hélène Lefèvre', email: 'helene@exemple.be' },
      { id: '2', nom: 'Marc Dubois', email: '' },
      { id: '3', nom: 'Helena Peeters', email: 'h.peeters@exemple.be' },
      { id: '4', nom: 'Ancienne fiche', email: 'vieux@exemple.be', fusionne_dans: '1' },
      { id: '5', nom: 'Effacé', email: '', supprime: true },
    ];
    test('clients : normalisation et e-mail', () => {
      egal(normaliser('  Hélène  LEFÈVRE '), 'helene lefevre');
      egal(emailValide('a@b.be'), true); egal(emailValide('a@b'), false); egal(emailValide(''), false);
    });
    test('clients : recherche sans accents ni casse, sur nom et e-mail', () => {
      egal(rechercher(clients, 'hel').map((c) => c.id), ['3', '1']);
      egal(rechercher(clients, 'LEFEV').map((c) => c.id), ['1']);
      egal(rechercher(clients, 'h.peeters').map((c) => c.id), ['3']);
      egal(rechercher(clients, 'h').length, 0);
    });
    test('clients : le dernier acheteur sort en premier', () => {
      egal(rechercher(clients, 'hel', { 1: { dernier: '2026-11-01' }, 3: { dernier: '2026-05-01' } }).map((c) => c.id), ['1', '3']);
    });
    test('clients : fiches fusionnées ou supprimées exclues de la recherche', () => {
      egal(rechercher(clients, 'ancienne').length, 0); egal(rechercher(clients, 'efface').length, 0);
    });
    test('clients : doublon par e-mail', () => {
      egal(trouverDoublons(clients, { nom: 'Autre nom', email: ' HELENE@exemple.be ' }).parEmail.id, '1');
      egal(trouverDoublons(clients, { nom: 'Autre nom', email: 'neuf@exemple.be' }).parEmail, null);
    });
    test('clients : doublon par nom identique ou très proche', () => {
      egal(trouverDoublons(clients, { nom: 'helene lefevre', email: '' }).parNom.map((c) => c.id), ['1']);
      egal(trouverDoublons(clients, { nom: 'Marc Duboi', email: '' }).parNom.map((c) => c.id), ['2']);
      egal(trouverDoublons(clients, { nom: 'Jean Martin', email: '' }).parNom.length, 0);
      egal(trouverDoublons(clients, { id: '2', nom: 'Marc Dubois', email: '' }).parNom.length, 0);
      egal(distance('chat', 'chats'), 1);
    });
    test('clients : statistiques hors ventes annulées', () => {
      const s = statsClients([
        { client_id: '1', total_cents: 2000, date_heure: '2026-11-01T10:00:00Z', statut: 'payee' },
        { client_id: '1', total_cents: 1000, date_heure: '2026-11-10T10:00:00Z', statut: 'payee' },
        { client_id: '1', total_cents: 5000, date_heure: '2026-11-12T10:00:00Z', statut: 'annulee' },
        { client_id: null, total_cents: 700, date_heure: '2026-11-12T10:00:00Z', statut: 'payee' },
      ]);
      egal(s, { 1: { nb: 2, total_cents: 3000, dernier: '2026-11-10T10:00:00Z' } });
    });

    const venteTicket = {
      numero: 'J26-0042', date_heure: '2026-11-17T13:05:00Z', mode_paiement: 'qr', langue: 'fr',
      total_cents: 1750, remise_cents: 200, remise_libelle: '10 %',
      lignes: [
        { produit_id: 'a', libelle: 'Miel <été>', lot: 'M03', quantite: 2, total_cents: 2000 },
        { produit_id: 'RETOUR_CONSIGNE', libelle: 'Retour consigne', lot: '', quantite: 1, total_cents: -50 },
      ],
    };
    const configTicket = { ticket_vendeur: 'Exemple asbl\nRue du Test 1, 1000 Bruxelles', ticket_pied: 'Merci !' };
    test('ticket : contenu en français', () => {
      const t = construireTicket(venteTicket, configTicket);
      egal(t.sujet, "Votre ticket Miel d'Enghien J26-0042");
      for (const morceau of ['2 × Miel <été> (lot M03) : 20,00 €', '1 × Retour consigne : -0,50 €', 'Remise 10 % : -2,00 €',
        'Total : 17,50 €', 'Payé par virement', 'Vendeur : Exemple asbl, Rue du Test 1, 1000 Bruxelles', "Ce document n'est pas une facture.", 'Merci !']) {
        if (!t.texte.includes(morceau)) throw new Error('absent du texte : ' + morceau);
      }
    });
    test('ticket : le HTML échappe les caractères spéciaux', () => {
      const t = construireTicket(venteTicket, configTicket);
      egal(t.html.includes('Miel &lt;été&gt;'), true); egal(t.html.includes('<été>'), false);
    });
    test('ticket : néerlandais avec noms traduits', () => {
      const t = construireTicket({ ...venteTicket, langue: 'nl', mode_paiement: 'liquide' }, configTicket, { a: 'Zomerhoning' });
      for (const morceau of ['2 × Zomerhoning (lot M03)', 'Statiegeld terug', 'Korting', 'Totaal : 17,50 €', 'Contant betaald', 'Dit document is geen factuur.']) {
        if (!t.texte.includes(morceau)) throw new Error('absent du texte : ' + morceau);
      }
      egal(t.sujet, "Uw ticket Miel d'Enghien J26-0042");
    });
    test('ticket : sans vendeur ni pied, pas de ligne vide en trop', () => {
      const t = construireTicket(venteTicket, {});
      egal(t.texte.includes('Vendeur'), false); egal(/\n\n\n/.test(t.texte), false);
    });

    test('annulation : mouvements exactement inverses de la vente', () => {
      const c = calculerPanier({ produits, quantites: { a: 2 }, consignes: 1 });
      egal(mouvementsAnnulation(c.lignes), [
        { produit_id: 'a', delta: 2, motif: 'annulation_vente' },
        { produit_id: 'POTS_VIDES', delta: -1, motif: 'annulation_vente' },
      ]);
      const s = calculerStocks([
        { produit_id: 'a', delta: 10, motif: 'recolte' },
        ...mouvementsDeVente(c.lignes), ...mouvementsAnnulation(c.lignes),
      ]);
      egal(s.a.quantite, 10); egal(s.POTS_VIDES.quantite, 0);
    });
    test('livraison magasin et don : motif du mouvement', () => {
      const c = calculerPanier({ produits, quantites: { a: 3 } });
      egal(mouvementsDeVente(c.lignes, 'livraison_magasin')[0], { produit_id: 'a', delta: -3, motif: 'livraison_magasin' });
      egal(mouvementsDeVente(c.lignes, 'don')[0].motif, 'don');
    });

    // Dates à midi heure locale pour ne pas dépendre du fuseau.
    const le = (j, m = 10) => new Date(2026, m, j, 12, 0).toISOString();
    const journal = [
      { id: 'v1', date_heure: le(14), canal: 'marche', mode_paiement: 'qr', statut: 'payee', total_cents: 2000, lignes: [{ libelle: 'Miel', lot: 'M02', quantite: 2 }] },
      { id: 'v2', date_heure: le(14), canal: 'domicile', mode_paiement: 'liquide', statut: 'payee', total_cents: 1000, lignes: [{ libelle: 'Miel', lot: 'M02', quantite: 1 }] },
      { id: 'v3', date_heure: le(15), canal: 'marche', mode_paiement: 'liquide', statut: 'payee', total_cents: 1500, lignes: [{ libelle: 'Hydromel', lot: '', quantite: 1 }] },
      { id: 'v4', date_heure: le(15), canal: 'marche', mode_paiement: 'liquide', statut: 'annulee', total_cents: 9900, lignes: [] },
      { id: 'v5', date_heure: le(15), canal: 'magasin', mode_paiement: 'facture_smart', statut: 'en_attente', total_cents: 8000, lignes: [] },
      { id: 'v6', date_heure: le(15), canal: 'marche', mode_paiement: 'offert', statut: 'payee', total_cents: 0, lignes: [] },
      { id: 'v7', date_heure: le(3, 9), canal: 'marche', mode_paiement: 'qr', statut: 'payee', total_cents: 500, lignes: [] },
    ];
    test('journal Smart : seuls les encaissements QR et liquide hors magasin', () => {
      egal(encaissements(journal).map((v) => v.id), ['v1', 'v2', 'v3', 'v7']);
      egal(livraisonsAFacturer(journal).map((v) => v.id), ['v5']);
    });
    test('journal Smart : regroupement par jour', () => {
      const g = regrouper(encaissements(journal), 'jour');
      egal(g.map((x) => [x.cle, x.nb, x.total_cents]), [['2026-11-15', 1, 1500], ['2026-11-14', 2, 3000], ['2026-10-03', 1, 500]]);
      egal(g[1].parMode, { qr: 2000, liquide: 1000 });
      egal(g[1].parProduit, { 'Miel M02': 3 });
      egal(g[1].ids, ['v1', 'v2']);
    });
    test('journal Smart : regroupement par mois', () => {
      const g = regrouper(encaissements(journal), 'mois');
      egal(g.map((x) => [x.cle, x.nb, x.total_cents]), [['2026-11', 3, 4500], ['2026-10', 1, 500]]);
      egal(clePeriode(le(3, 9), 'mois'), '2026-10');
    });
    test('journal Smart : export texte et CSV', () => {
      const g = regrouper(encaissements(journal), 'mois');
      const csv = versCsv(g).split('\r\n');
      egal(csv[0], '"periode";"nb_ventes";"total";"virement";"liquide";"detail"');
      egal(csv[1], '"2026-11";"3";"45,00";"20,00";"25,00";"3 × Miel M02, 1 × Hydromel"');
      egal(versTexte(g).includes('3 vente(s) — 45,00 €'), true);
    });

    const echecs = resultats.filter((r) => !r.ok).length;
    document.getElementById('bilan').textContent = echecs ? `${echecs} échec(s) sur ${resultats.length}` : `${resultats.length} tests réussis`;
    document.getElementById('bilan').className = echecs ? 'ko' : 'ok';
    document.getElementById('resultats').innerHTML = resultats
      .map((r) => `<li class="${r.ok ? 'ok' : 'ko'}">${r.ok ? '✓' : '✗'} ${r.nom}${r.detail ? ` — ${r.detail}` : ''}</li>`).join('');
    window.__tests = { total: resultats.length, echecs, resultats };
  </script>
</body>
</html>
