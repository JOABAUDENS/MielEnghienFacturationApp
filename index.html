<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#d97706">
  <title>Miel d'Enghien</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon-192.png">
  <link rel="apple-touch-icon" href="icons/icon-192.png">
  <link rel="stylesheet" href="css/app.css">
</head>
<body>
  <header class="entete">
    <h1>🐝 Miel d'Enghien</h1>
    <button type="button" id="pastille" class="pastille" hidden aria-label="État de la synchronisation"></button>
  </header>
  <div id="maj" class="maj" hidden>
    Mise à jour disponible <button type="button">Recharger</button>
  </div>

  <main id="vue"><p class="vide">Chargement…</p></main>

  <nav id="onglets" class="onglets">
    <button type="button" data-onglet="vente"><span>🛒</span>Vente</button>
    <button type="button" data-onglet="ventes"><span>📋</span>Ventes</button>
    <button type="button" data-onglet="stock"><span>🍯</span>Stock</button>
    <button type="button" data-onglet="clients"><span>👤</span>Clients</button>
    <button type="button" data-onglet="reglages"><span>⚙️</span>Réglages</button>
  </nav>

  <div id="toast" class="toast" role="status" aria-live="polite"></div>

  <script src="vendor/qrcode.js"></script>
  <script type="module" src="js/app.js"></script>
</body>
</html>
